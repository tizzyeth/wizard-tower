name: Data crons (every 30 min)

# The single scheduled job that keeps every data pipeline alive: it POSTs all
# three Bearer-gated cron routes in one run. The per-route workflows still exist
# for manual dispatch (debugging, backfill) but no longer carry a schedule.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY ONE JOB — the free-tier arithmetic
#
# GitHub bills each Actions job ROUNDED UP TO A WHOLE MINUTE, and a private repo
# on the Free plan gets 2,000 minutes/month. These routes each take ~10-20s, so
# every run of every workflow costs a full billed minute regardless.
#
#   As three separate schedules:
#     snapshot  hourly    =   730 runs/mo
#     social    */30      = 1,459 runs/mo
#     trades    */15      = 2,918 runs/mo
#                           ─────────────
#                           5,107 billed min/mo  →  2.6x OVER the free tier.
#     (Even the two pre-archive crons alone came to 2,190 — already over.)
#
#   As one job at */30:   1,459 billed min/mo  →  fits, with headroom.
#
# The quota is not a soft limit: once it is spent, scheduled workflows simply
# stop running until the next billing cycle, and the dashboard's data silently
# freezes. (GET /api/health + the header dot would catch it — see lib/health.ts —
# but "caught quickly" is worse than "did not happen".)
#
# WHY */30 IS STILL SAFE FOR THE TRADE ARCHIVE — the binding constraint here is
# correctness, not cost: GeckoTerminal's /trades is a window of at most 300 trades
# AND 24h per pool, and whatever leaves it before we read is unrecoverable. At the
# busiest day in this token's history (~246 trades/h) a pool fills 300 in ~73 min,
# so a 30-minute cadence keeps ~2.4x headroom and still survives a scheduler that
# runs late. See .github/workflows/trades-archive.yml for the full derivation.
#
# If the repo is ever made PUBLIC, Actions minutes become free and unlimited —
# at that point this can drop back to */15 (4.9x headroom) or split apart again.
# ─────────────────────────────────────────────────────────────────────────────
#
# Requires, on the repo (Settings → Secrets and variables → Actions):
#   • Variable  SITE_URL     = production origin, e.g. https://wizard-tower-iota.vercel.app
#   • Secret    CRON_SECRET  = the same value stored in Vercel prod
# Scheduled workflows only fire from the default branch.

on:
  schedule:
    # Offset off :00/:30 deliberately — GitHub's scheduler is most congested, and
    # most delayed, at the top of the hour.
    - cron: "7,37 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never overlap two runs; let an in-flight one finish rather than cancel it.
# (A cancelled trades run is a missed window, and missed windows are unrecoverable.)
concurrency:
  group: data-crons
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failed: ${{ steps.post.outputs.failed }}
    steps:
      - name: POST every cron route
        id: post
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # NOTE: deliberately no `set -e`. Every route must be attempted even if
          # an earlier one fails — a broken X poller must not stop the trade
          # archive, whose missed windows can never be recovered.
          set -uo pipefail

          if [ -z "${SITE_URL:-}" ]; then
            echo "::error::SITE_URL variable is unset — add it in repo Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is unset — add it in repo Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

          FAILED=""

          post() {
            route="$1"; label="$2"
            echo "::group::POST ${route}"
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "${SITE_URL%/}${route}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "content-type: application/json" \
              --max-time 90 --retry 2 --retry-delay 15 --retry-all-errors)
            echo "HTTP status: $code"
            echo "Response:"; cat /tmp/resp.json; echo
            echo "::endgroup::"
            if [ "$code" != "200" ]; then
              echo "::error::${label} cron returned HTTP ${code}"
              FAILED="${FAILED}${FAILED:+, }${route}"
              return
            fi
            # An unrecoverable trade-archive gap is a warning, not a failure: the
            # data we did get is stored, but an operator needs to see it.
            if [ "$route" = "/api/cron/trades" ] && grep -q '"gap":{' /tmp/resp.json; then
              echo "::warning::Coverage gap — trades were missed between runs. Consider a faster cadence (see data-crons.yml)."
            fi
          }

          # Trades first: it is the only route whose missed data is unrecoverable.
          post /api/cron/trades   trades
          post /api/cron/snapshot snapshot
          post /api/cron/social   social

          # Written before exiting so the alert job can name what broke.
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED" ]; then
            echo "::error::Failed routes: ${FAILED}"
            exit 1
          fi
          echo "All cron routes returned 200."

  # Make the failure visible in the repo, not just in an email that gets filtered.
  # `issues: write` is declared HERE because a called workflow can only ever narrow
  # the caller's permissions, never widen them.
  alert:
    needs: run
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/cron-failure-issue.yml
    with:
      workflow-name: Data crons (every 30 min)
      route: ${{ needs.run.outputs.failed || '/api/cron/* — see the run log' }}
